# ---- mass spectrometry --------------------------------------------------------------------

[[field]]
ids = ["pwiz-thermo-ltqvelos"]
fields = ["spectrum count", "MS1 spectrum count"]
right = "openreadout"
why = "the reference conversion leaves out 14 of the 99 scans: scans 7, 14, ..., 97, every one the three-range SIM scan `ITMS + c NSI SIM ms [428.00-438.00, 646.50-651.50, 669.50-684.50]`; its fileContent lists `selected ion monitoring chromatogram` (MS:1001472): ProteoWizard wrote them as SIM chromatograms, not spectra. The other 85 agree scan by scan"

[[field]]
ids = ["mtbls797-dotsha05"]
fields = ["spectrum count", "MS1 spectrum count", "polarities", "last retention time"]
right = "openreadout"
why = "a polarity-switching run (filters `FTMS {1,1}  + p ESI Full lock ms` 619 scans, `FTMS {2,1}  - p ESI ...` 485 + 134): the depositor's mzML holds only the 619 positive scans (its 619 spectra all carry that filter string and `positive scan`), which agree with ours scan by scan"

[[field]]
ids = ["mtbls1820-lumos-uplc-31"]
fields = ["spectrum count", "last retention time"]
right = "openreadout"
why = "the depositor's mzML holds only the 1,030 MS1 spectra (every one `ms level 1`), which equal our 1,030 MS1 scans scan by scan; the run's 4,594 MS2 scans were not exported, so the export ends at the last MS1 scan (599.68 s) and ours at the last MS2 scan (600.16 s)"

[[field]]
ids = ["mtbls13880-bcells-lipidomics-pos-cko-ab", "mtbls14308-mwy251008a-mix01", "mtbls1820-lumos-uplc-31", "mtbls1822-tsq-74", "mtbls755-hilic-dpoly", "mtbls797-dotsha05", "mtbls805-imaging-732", "mtbls805-msms-869"]
fields = ["instrument model"]
right = "openreadout"
why = "ours is the model string the raw file's instrument id holds (`Q Exactive HF Orbitrap`, `TSQ Vantage Standard`, `Orbitrap Fusion Lumos`, `Thermo Exactive Orbitrap`, `Q Exactive Plus Orbitrap`); the conversion writes the nearest PSI-MS instrument term its converter knew (`Q Exactive HF`, `TSQ Vantage`, `Orbitrap Fusion`, `Exactive`, older converters `Q Exactive` for an HF and a Plus): the same instrument, the term less specific"

[[field]]
ids = ["mtbls755-hilic-dpoly"]
fields = ["acquisition start (up to a zone offset)"]
right = "openreadout"
why = "ours is the file-info block's UTC time (16:43:35.432Z; docs/formats/thermo-raw.md); the conversion's 16:45:04 is 89 s later, the audit stamp that the format note records as differing from the UTC time by a further 90 s in this one file (MTBLS755): two acquisition times the file holds, not a misreading"

[[field]]
ids = ["pwiz-agilent-gfb-4scan-timesegs", "pwiz-agilent-thyrxox-ts-diff-scan"]
fields = ["spectrum count", "MS2 spectrum count", "last retention time"]
right = "openreadout"
why = "the ProteoWizard reference (3.0.18264 unit-test data) holds only the first 182 (233) spectra, which agree with ours by position; the .d's own MSTS.xml declares 63 + 60 + 59 + 428 = 610 (and 804) scans in its time segments, which our count equals (check `scans in the time segments (MSTS.xml)`)"

[[field]]
