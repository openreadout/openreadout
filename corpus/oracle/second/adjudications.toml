[file.metamorph-figshare7583960-w1-t1-stk]
right = "openreadout"
why = "convention: Bio-Formats groups the whole MetaMorph file set whose names this file matches (2 wavelengths x 24 time points of 14-plane stacks) into one series; OpenReadout reads the file opened (14 planes as Z) and the set when the .nd is opened; the planes both expose (t = 0, c = 0) agree"

[recorded.zenodo16108826-sample-45-21]
right = "openreadout"
why = "single-subfile Galactic SPC written by OMNIC with a main exponent of 2 and a subfile exponent of 0; the format's layout notes (as quoted by SpectroChemPy) say the subfile exponent is ignored unless the file is a multifile. spc-io 0.2.1 scales by the subfile exponent and returns values 4x smaller. The writer's choice confirms the main exponent: fixed-point fractions are below 1, and this spectrum peaks at 1.536 absorbance, which only exponent 2 can hold. SpectroChemPy and OpenReadout agree"

