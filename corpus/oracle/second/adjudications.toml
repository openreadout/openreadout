# ---- chromatography ------------------------------------------------------------------------

[[field]]
ids = ["chromhandler-001f0101-d", "chromhandler-001f0102-d", "chromhandler-001f0103-d", "chromhandler-001f0104-d", "gc2asm-v181-d"]
fields = ["*.ch: signal: sample count", "*.ch: signal: mean", "*.ch: last time (min)"]
right = "openreadout"
why = "chromConverter 0.9 returns one value more than the header declares (3,601 for 3,600; 5,914 for 5,913): the last stored value repeated at a time it spreads over the header's range with a slightly smaller step (0.0033324 min for the header's 0.0033333); its first 3,600 values equal ours exactly (maximum difference 0), so only the count and mean differ. rainbow-api and Aston, the primary oracles, read the declared count"

[[field]]
ids = ["gc2asm-three-channels-d", "entab-test-179-fid-ch"]
fields = ["*.ch: signal: *", "*_fid.ch: signal: *"]
right = "openreadout"
why = "on these version-179 files chromConverter's values are ours divided by a constant (about 4,281 and 8,030: 3.8470 against 0.00089865, 7.7457 against 0.00096454), a scale it misapplies; rainbow-api (a third reader, the primary oracle of entab-test-179) returns ours exactly (3.84700521, 7.74570312 pA, `unit: pA` in its metadata)"

[[field]]
ids = ["lcd-streamfind-adc-uv", "zenodo17868549-gp070190p-hplc", "gcd-cct-fs19-214"]
fields = ["Chromatogram Ch*"]
right = "openreadout"
why = "chromConverter 0.9 returns the stored integers unscaled (64 where ours is 64 × 4.768e-6 mV) and, for the two-channel .lcd, a long table whose Ch1/Ch5 rows interleave samples of both channels; the depositors' LabSolutions ASCII exports, the vendor software's own values, equal ours point for point (corpus test, oracle/shimadzu_export.py). On the .gcd (f64 values, no scaling) its values are ours from the second point on: ours starts with LabSolutions' t = 0 point, the first stored reading repeated (the convention the vendor's ASCII exports of LC runs show, docs/formats/shimadzu.md § Points), chromConverter at the first stored reading (0.000667 min)"

[[field]]
ids = ["lcd-streamfind-adc-uv", "zenodo17868549-gp070190p-hplc", "gcd-cct-fs19-214"]
fields = ["acquisition time"]
right = "openreadout"
why = "ours is `File Property`'s generated FILETIME (UTC; docs/formats/shimadzu.md: 07:29:29 UTC for a batch named 15:29 local, UTC+8); chromConverter reports a time 19-22 s later without a zone (another event of the run): not the same field"

[[field]]
ids = ["zhulong-001-1-sm-d"]
fields = ["DAD1.UV: *"]
right = "openreadout"
why = "chromConverter writes these DAD values to seven significant digits (-888.0587 for our -888.05866241, the stored integer times 0.000476837 mAU)"

