# Where OpenReadout and a second-opinion reader (oracle/second_opinion.py) disagree, and who is
# right. Read by the corpus test `second_opinions_agree` (crates/openreadout-corpus-tests/tests/
# second_opinion.rs): a disagreement without an entry here fails it. Investigated 2026-09-26.
# `right`: openreadout | second | neither.

[file.openslide-zeiss-5-slidepreview-zstd1-hilo]
right = "openreadout"
why = "the same SlidePreview is in the corpus as zstd0 (lossless) and JPEG XR: our zstd1-HiLo plane is bit-identical to our and czifile's zstd0 plane, and czifile agrees with ours on this file; pylibCZIrw 6.1's zstd1-HiLo decode of this bgr48 image differs from its own zstd0 decode (mean 16620 against 49677), so the second reader is wrong on HiLo-packed 48-bit RGB"

[file.aics-variable-per-scene-dims]
right = "openreadout"
why = "the two scenes have different T extents; the oracle script asked pylibCZIrw for the file-wide T range in every scene, so it read time points scene 1 does not have (blank canvas); ours reports them out of range, as czifile's per-scene sizes do (script artefact, not a reader difference)"

[file.zenodo10577621-PALM-OnlineVerrechnet]
right = "openreadout"
why = "PALM rendering: channel 0's subblock stores 1206 x 1206 pixels for a 512 x 512 logical extent, channel 1 is the 512 x 512 widefield image. pylibCZIrw and czifile's default read resample the rendering to the 512 grid (the super-resolved pixels are lost). Since 2026-09-25 (docs/provenance/czi.md) OpenReadout exposes one image per stored-to-logical ratio: the widefield channel at 512 x 512 (0.1587 um, equal to pylibCZIrw's plane) and the rendering at 1206 x 1206 with the pixel size divided by the ratio (0.06739 um), its pixels equal to czifile's asarray(storedsize=True, C=0) (corpus/oracle). The remaining difference with pylibCZIrw is its resampled rendering. (Before the fix both channels shared the 1206 canvas and the logical pixel size.)"

[file.zenodo10577621-Palm-mitDrift]
right = "openreadout"
why = "as zenodo10577621-PALM-OnlineVerrechnet: a 2560 x 2560 stored rendering of a 256 x 256 logical extent is its own image at 0.01 um per pixel, the widefield channel another at 0.1 um; see that entry"

[file.zenodo13752242-FLIM250523]
right = "openreadout"
why = "the FLIM-derived images (Fast Flim, Standard Deviation, phasor maps) store 16-bit IEEE half floats; readlif 0.6.6 returns their raw bits as uint16 (Fast Flim mean 7446, max 21085), liffile and ours decode half floats (mean 1.361, max 16.0; Standard Deviation mean 0.955); the decoded values are plausible lifetimes in ns, readlif's are not"

# Second opinions recorded inside the primary oracle JSONs (`*_agrees`, `agrees_with_*`,
# `planes_disagree`), keyed by the oracle file's stem: checked by `recorded_second_opinions`.

[recorded.flowio-data-start-offset-discrepancy]
right = "openreadout"
why = "a deliberately inconsistent FlowIO test file: HEADER says DATA is 5555-6188 (634 bytes), TEXT says 6081-6188 (108 bytes = 2 events of 54 bytes, matching $TOT). FlowIO and OpenReadout take the TEXT offsets, which fit $TOT and $PAR exactly; fcsparser takes the HEADER offsets and reads 634 bytes of TEXT and DATA as events. `check` reports offset_discrepancy (docs/formats/fcs.md)"

[recorded.zenodo19221995-facsdiscover-zam36-yfp]
right = "openreadout"
why = "FCS 3.2 with per-measurement $PnDATATYPE (mixed I and F columns); fcsparser 0.2 ignores $PnDATATYPE and decodes every column with $DATATYPE, so its floats are integers reinterpreted. The oracle re-reads DATA with a NumPy record type built from the $PnDATATYPE values (docs/formats/fcs.md, FCS 3.2)"

[recorded.opus-or2-issue81-a1-1]
right = "openreadout"
why = "brukeropusreader 1.3 (GPL, black box) returns an AB block of denormals and 3.4e38 values (690 points against the 1866 the AB data-parameter block declares): it misreads this OPUS 8 file (the file is the opusreader2 issue-81 example of exactly that); brukeropus (MIT) and OpenReadout agree on 1866 plausible absorbances"

[recorded.opus-or2-issue82-opus-test]
right = "openreadout"
why = "brukeropusreader returns 1154 points of another block as AB; the AB data-parameter block declares 1112, which brukeropus and OpenReadout read identically (opusreader2 issue-82 example)"

[recorded.opus-or2-mmp-2107-test1]
right = "openreadout"
why = "brukeropusreader returns 1510 garbage values (denormals, 3.4e38, zeros) as AB; brukeropus and OpenReadout agree on the 1899 points the AB data-parameter block declares"

