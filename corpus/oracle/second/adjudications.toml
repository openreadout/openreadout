fields = ["instrument model"]
right = "openreadout"
why = "ours is the `Component ID` the .wiff's Log stream holds (`4000 Q TRAP`, `QTRAP 6500+`, `TripleTOF 5600+`, UTF-16 in the file); the conversion writes the PSI-MS term (`4000 QTRAP`, `QTRAP 6500`, `TripleTOF 5600`), which has no `+` models"

[[field]]
