# cargo-about configuration: generates THIRD-PARTY-NOTICES.md for the shipped `openreadout` binary.
#
#   cargo fetch --locked && cargo about generate --frozen --fail -m crates/openreadout-cli/Cargo.toml about.hbs -o THIRD-PARTY-NOTICES.md
#
# CI (`third-party-notices` job) regenerates it and fails if the committed file is out of date.
# The accepted list mirrors deny.toml [licenses].allow (only what the binary actually uses matters).

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
]

# The union over every release target, so the output does not depend on the host that runs it.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Only what is linked into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
