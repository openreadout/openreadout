[package]
name = "openreadout-qpcr"
description = "Readers for real-time PCR (qPCR) files and an RDML writer, part of OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["qpcr", "rdml", "pcr", "quantstudio", "parser"]
categories = ["parser-implementations", "science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-qpcr"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
roxmltree = { workspace = true }
miniz_oxide = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
