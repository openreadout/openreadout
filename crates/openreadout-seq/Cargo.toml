[package]
name = "openreadout-seq"
description = "Readers for DNA sequencer output (Illumina run folders, Oxford Nanopore POD5 and FAST5, FASTQ, BAM and CRAM), part of OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["sequencing", "illumina", "nanopore", "bam", "cram"]
categories = ["parser-implementations", "science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-seq"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-hdf5 = { workspace = true }
hdf5-pure = { workspace = true }
arrow-ipc = { workspace = true }
flate2 = { workspace = true }
ruzstd = { workspace = true }
bzip2-rs = { workspace = true }
lzma-rs = { workspace = true }
md-5 = { workspace = true }
crc32fast = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
