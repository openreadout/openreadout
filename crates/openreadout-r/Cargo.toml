[package]
name = "openreadout-r"
description = "Native part of the OpenReadout R package (extendr)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

# Built by the R package (r/openreadout/src/Makevars) as a static library that R links into
# openreadout.so. Not a default workspace member: extendr's build script needs an R installation
# (R_HOME, or `R` on PATH), like the Python bindings need maturin.
[lib]
name = "openreadout_r"
crate-type = ["staticlib", "rlib"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-ops = { workspace = true }
openreadout-czi = { workspace = true }
openreadout-nd2 = { workspace = true }
openreadout-lif = { workspace = true }
openreadout-thermo = { workspace = true }
openreadout-agilent-ms = { workspace = true }
openreadout-sciex = { workspace = true }
openreadout-spectro = { workspace = true }
openreadout-biophys = { workspace = true }
openreadout-gel = { workspace = true }
openreadout-thermal = { workspace = true }
openreadout-echem = { workspace = true }
openreadout-xrd = { workspace = true }
openreadout-epr = { workspace = true }
openreadout-fplc = { workspace = true }
openreadout-waters = { workspace = true }
openreadout-mzml-writer = { workspace = true }
openreadout-tiff = { workspace = true }
openreadout-fcs = { workspace = true }
openreadout-plate = { workspace = true }
openreadout-qpcr = { workspace = true }
openreadout-oir = { workspace = true }
openreadout-vsi = { workspace = true }
openreadout-wsi = { workspace = true }
openreadout-abf = { workspace = true }
openreadout-neuralynx = { workspace = true }
openreadout-blackrock = { workspace = true }
openreadout-spikeglx = { workspace = true }
openreadout-intan = { workspace = true }
openreadout-plexon = { workspace = true }
openreadout-ephys = { workspace = true }
openreadout-mzml = { workspace = true }
openreadout-bruker-tims = { workspace = true }
openreadout-chrom = { workspace = true }
openreadout-em = { workspace = true }
openreadout-zarr = { workspace = true }
openreadout-hdf5 = { workspace = true }
openreadout-zvi = { workspace = true }
openreadout-oif = { workspace = true }
openreadout-dcimg = { workspace = true }
openreadout-hcs = { workspace = true }
openreadout-nmr = { workspace = true }
openreadout-ometiff = { workspace = true }
openreadout-omezarr = { workspace = true }
openreadout-arrow = { workspace = true }
openreadout-quant = { workspace = true }
openreadout-batch = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# R bindings (MIT). No default features: plain vectors, lists and external pointers only.
extendr-api = { version = "0.9", default-features = false }

# The workspace lints, except `unsafe_code`: the `#[extendr]` and `extendr_module!` macros expand to
# the `extern "C"` entry points R calls, which are unsafe. This crate's own source contains no
# `unsafe` (checked by the `no_unsafe_in_source` test).
[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
cast_possible_wrap = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
format_push_string = "allow"
return_self_not_must_use = "allow"
unused_async = "allow"
unused_self = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
assigning_clones = "allow"
verbose_bit_mask = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
default_trait_access = "allow"
manual_div_ceil = "allow"
doc_markdown = "allow"
fn_params_excessive_bools = "allow"
# c, z, t, x, y, w, h are the natural names of plane indices and rectangles
many_single_char_names = "allow"
# the code `#[extendr]` generates binds the arguments under underscore-prefixed names
used_underscore_binding = "allow"
