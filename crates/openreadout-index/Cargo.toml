[package]
name = "openreadout-index"
description = "Headers-only catalog of a lab file share, stored as Parquet, for search and storage health"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["catalog", "parquet", "microscopy", "mass-spectrometry", "fair-data"]
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/openreadout-index"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-omezarr = { workspace = true }
openreadout-arrow = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
rayon = { workspace = true }
glob = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
openreadout-fcs = { workspace = true }
openreadout-tiff = { workspace = true }
openreadout-zarr = { workspace = true }
openreadout-hcs = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
