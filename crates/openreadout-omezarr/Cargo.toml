[package]
name = "openreadout-omezarr"
description = "OME-Zarr writer for OpenReadout exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ome-zarr", "ngff", "zarr", "microscopy", "ome"]
categories = ["encoding", "multimedia::images", "science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-omezarr"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-ometiff = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
xxhash-rust = { workspace = true }
zarrs = { workspace = true, features = ["filesystem"] }

[dev-dependencies]
tempfile = { workspace = true }
openreadout-zarr = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
