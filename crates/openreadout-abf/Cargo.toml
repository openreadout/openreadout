[package]
name = "openreadout-abf"
description = "Reader for Axon Binary Format (ABF) electrophysiology files, part of OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["electrophysiology", "abf", "patch-clamp", "axon", "parser"]
categories = ["parser-implementations", "science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-abf"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
