[package]
name = "openreadout-lif"
description = "Reader for Leica LIF microscopy files, part of OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["lif", "leica", "microscopy", "ome", "parser"]
categories = ["parser-implementations", "science", "multimedia::images"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-lif"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[features]
# Byte-slice entry points for the cargo-fuzz targets in `fuzz/`; not a stable API.
fuzzing = []

[dependencies]
openreadout-core = { workspace = true }
openreadout-codecs = { workspace = true }
openreadout-tiff = { workspace = true }
png = { workspace = true }
roxmltree = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
