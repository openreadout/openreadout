[package]
name = "openreadout-preview"
description = "PNG and JPEG previews of OpenReadout datasets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["microscopy", "preview", "png", "thumbnail", "openreadout"]
categories = ["science", "multimedia::images"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-preview"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
xxhash-rust = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
jpeg-decoder = { workspace = true }
xxhash-rust = { workspace = true }
serde_json = { workspace = true }
