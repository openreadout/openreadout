[package]
name = "openreadout-core"
description = "Core traits, normalized metadata model, provenance tags, JSON output and exit codes for OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["microscopy", "metadata", "ome", "lab-instruments", "openreadout"]
categories = ["science", "parser-implementations"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-core"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
xxhash-rust = { workspace = true }
roxmltree = { workspace = true }
rayon = { workspace = true }
glob = { workspace = true }
miniz_oxide = { workspace = true }
crc32fast = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
flate2 = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
