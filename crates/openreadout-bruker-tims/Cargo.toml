[package]
name = "openreadout-bruker-tims"
description = "Reader for Bruker timsTOF .d directories, part of OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mass-spectrometry", "timstof", "bruker", "ion-mobility", "proteomics"]
categories.workspace = true
readme = "README.md"
documentation = "https://docs.rs/openreadout-bruker-tims"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-codecs = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ruzstd = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
