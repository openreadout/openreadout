[package]
name = "openreadout-ometiff"
description = "OME-TIFF writer for OpenReadout exports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ome-tiff", "bigtiff", "ome-xml", "microscopy", "tiff"]
categories = ["encoding", "multimedia::images", "science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-ometiff"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
# Read-back verification of tiled (pyramidal) output through the TIFF reader.
openreadout-tiff = { workspace = true }
tiff = { workspace = true }
rayon = { workspace = true }
flate2 = { workspace = true }
weezl = { workspace = true }
xxhash-rust = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
openreadout-ops = { workspace = true }
roxmltree = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
