[package]
name = "openreadout-plot"
description = "Figures from lab files for OpenReadout: name the data by file and selector, get a finished plot as PNG, SVG or PDF"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["plot", "figure", "lab-data", "openreadout"]
categories = ["science", "visualization"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-plot"
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-figure = { workspace = true }
openreadout-assay = { workspace = true }
openreadout-batch = { workspace = true }
openreadout-fcs = { workspace = true }
openreadout-quant = { workspace = true }
openreadout-signal = { workspace = true }
openreadout-qpcr = { workspace = true }
miniz_oxide = { workspace = true }
png = { workspace = true }
tiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
