[package]
name = "openreadout-mcp"
description = "MCP (Model Context Protocol) server that exposes OpenReadout operations as agent tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "microscopy", "ai-agents", "llm", "openreadout"]
categories = ["science", "development-tools"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-mcp"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-ops = { workspace = true }
openreadout-fcs = { workspace = true }
openreadout-ometiff = { workspace = true }
openreadout-omezarr = { workspace = true }
openreadout-plate = { workspace = true }
openreadout-qpcr = { workspace = true }
openreadout-mzml-writer = { workspace = true }
openreadout-preview = { workspace = true }
openreadout-index = { workspace = true }
openreadout-batch = { workspace = true }
openreadout-live = { workspace = true }
rayon = { workspace = true }
openreadout-hdf5 = { workspace = true }
openreadout-nmr = { workspace = true }
openreadout-signal = { workspace = true }
openreadout-arrow = { workspace = true, optional = true }
rmcp = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }

[features]
# `format: "parquet"|"arrow"` of `openreadout_export` (Apache Arrow/Parquet, pure Rust).
parquet = ["dep:openreadout-arrow"]
# Streamable HTTP transport (`serve_http`): a loopback hyper server around rmcp's
# StreamableHttpService. Off by default: the stdio server needs no networking code.
http = [
    "rmcp/transport-streamable-http-server",
    "tokio/net",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
