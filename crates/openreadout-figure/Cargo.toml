[package]
name = "openreadout-figure"
description = "Vector figures for OpenReadout: themes, text with real font metrics, axes and charts, rendered to PNG, JPEG or SVG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The code is MIT OR Apache-2.0; the embedded IBM Plex fonts (fonts/) are OFL-1.1.
license = "(MIT OR Apache-2.0) AND OFL-1.1"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["plot", "chart", "svg", "png", "openreadout"]
categories = ["science", "visualization", "multimedia::images"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-figure"
# Only sources, fonts, README and licenses are packaged.
include = ["/src", "/fonts", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
png = { workspace = true }
tiny-skia = { workspace = true }
skrifa = { workspace = true }
miniz_oxide = { workspace = true }

[dev-dependencies]
jpeg-decoder = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
