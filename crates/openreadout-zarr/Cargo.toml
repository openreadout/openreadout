[package]
name = "openreadout-zarr"
description = "Reader for OME-Zarr images and plates, part of OpenReadout"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ome-zarr", "ngff", "zarr", "microscopy", "hcs"]
categories = ["parser-implementations", "science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-zarr"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
openreadout-codecs = { workspace = true }
openreadout-tiff = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
# pure-Rust codecs only; blosc and zstd come from openreadout-codecs (see src/codecs.rs)
zarrs = { workspace = true, features = ["gzip", "zlib", "sharding", "crc32c", "transpose"] }

# Local directory stores go through zarrs' own filesystem store. wasm32 has no file system, so
# there directory stores are read through the input's byte-source namespace.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zarrs = { workspace = true, features = ["filesystem"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
