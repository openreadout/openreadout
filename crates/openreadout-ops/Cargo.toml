[package]
name = "openreadout-ops"
description = "Command-level operations over OpenReadout datasets: file comparison, plain-English explanations, attachment extraction and JSON projection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["microscopy", "lab-instruments", "metadata", "openreadout"]
categories = ["science"]
readme = "README.md"
documentation = "https://docs.rs/openreadout-ops"
# Only sources, README and licenses are packaged (no tests, fixtures or corpus).
include = ["/src", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
openreadout-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
xxhash-rust = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
