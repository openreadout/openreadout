# cargo-deny configuration. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
# A yanked release is a warning: a pull request can't fix a release pulled upstream when the crate
# that needs it has no newer one (zip 8.6.0, required by calamine 0.36, was yanked in Oct 2026).
# Security problems still fail through the advisories above.
yanked = "warn"
ignore = [
    # `paste` (compile-time proc macro, no known vulnerability) is archived/unmaintained.
    # Only reachable through `zarrs` (OME-Zarr export); revisit when zarrs drops it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro pulled in by zarrs; no vulnerability" },
    # zip 8.6 comes in only through calamine, which reads spreadsheet parts into memory. These three
    # are about ZipArchive::extract writing files to disk, which neither calamine nor our code calls.
    # Drop them when calamine moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extraction to disk; calamine only reads entries in memory" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction to disk; calamine only reads entries in memory" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction to disk; calamine only reads entries in memory" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (TLS root store), only reachable from xtask
]
confidence-threshold = 0.9
# Fonts are data, not code: openreadout-figure embeds the IBM Plex font files unmodified, under
# the SIL Open Font License (crates/openreadout-figure/fonts/OFL.txt). Its own code stays MIT OR
# Apache-2.0. The MCP viewer page (crates/openreadout-mcp/src/app/web/fonts) embeds renamed
# subsets of the same fonts under the same licence, with their own OFL.txt and a NOTICE entry; it
# is page data, not a dependency, so it needs no exception here. No other crate may bring in
# OFL-licensed material.
exceptions = [
    { allow = ["OFL-1.1"], crate = "openreadout-figure" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The shipped binary must never talk to the network. Network crates are only allowed in xtask.
# One exception, a server rather than a client: hyper backs the opt-in Streamable HTTP MCP
# transport (`openreadout-mcp` feature `http`, CLI feature `mcp-http`; loopback-only by default,
# see book/src/reference/mcp.md). Release binaries are built without it; `all-features = true` above is why it
# appears here at all.
deny = [
    { crate = "reqwest", wrappers = ["xtask"] },
    { crate = "ureq", wrappers = ["xtask"] },
    { crate = "hyper", wrappers = ["xtask", "openreadout-mcp", "hyper-util"] },
    { crate = "hyper-util", wrappers = ["openreadout-mcp"] },
    { crate = "curl", wrappers = ["xtask"] },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
