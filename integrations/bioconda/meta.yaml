{% set name = "openreadout" %}
{% set version = "0.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/openreadout/openreadout/archive/refs/tags/v{{ version }}.tar.gz
  sha256: fc403b382b700fd9059821decb404aadb61779c270fae42a2d03c0519810bb18

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin="x.x") }}

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - openreadout --version
    - openreadout --help
    - openreadout self formats --json
    - openreadout self doctor --json

about:
  home: https://openreadout.github.io/openreadout/
  license: MIT OR Apache-2.0
  license_family: MIT
  license_file:
    - LICENSE-MIT
    - LICENSE-APACHE
    - NOTICE
    - THIRDPARTY.yml
  summary: Read raw microscopy, cytometry, mass spectrometry and other lab-instrument files without vendor software
  description: |
    OpenReadout is one binary that reads raw instrument files (Zeiss CZI, Nikon ND2, Leica LIF,
    Olympus, whole-slide images, FCS, Thermo RAW, mzML, Agilent, Waters, Sciex, ChemStation, ABF,
    RDML, plate-reader exports, Bruker NMR and more). It prints their metadata as JSON, exports
    them to open formats (OME-TIFF, OME-Zarr, mzML, Parquet), validates them, builds tables over
    many files, and serves the same operations as MCP tools.
  dev_url: https://github.com/openreadout/openreadout
  doc_url: https://openreadout.github.io/openreadout/reference/commands.html

extra:
  additional-platforms:
    - linux-aarch64
    - osx-arm64
  recipe-maintainers:
    - richardzimring
