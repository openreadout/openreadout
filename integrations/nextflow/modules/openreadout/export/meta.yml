name: "openreadout_export"
description: |
  Converts a raw laboratory instrument file to an open format without vendor software: images to
  OME-TIFF or OME-Zarr (pyramidal when the source has a pyramid), mass spectra to indexed mzML,
  tables (FCS events, plate reads) and traces (electrophysiology, chromatograms, NMR) to CSV or
  Parquet. Every output is read back and verified before it is renamed into place.
keywords:
  - microscopy
  - ome-tiff
  - ome-zarr
  - mzml
  - conversion
  - flow cytometry
  - mass spectrometry
tools:
  - "openreadout":
      description: "Reads raw lab-instrument files without vendor software: metadata as JSON, exports to open formats (OME-TIFF, OME-Zarr, mzML, Parquet), validation."
      homepage: "https://github.com/openreadout/openreadout"
      documentation: "https://openreadout.github.io/openreadout/reference/commands/export.html#export-formats"
      tool_dev_url: "https://github.com/openreadout/openreadout"
      licence: ["MIT", "Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input:
        type: file
        description: Raw instrument file or data-set directory
        pattern: "*"
  - format:
      type: string
      description: Target format
      enum: ["ome-tiff", "ome-zarr", "mzml", "csv", "parquet"]
output:
  - ome_tiff:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.ome.tiff":
          type: file
          description: OME-TIFF (BigTIFF with OME-XML)
          pattern: "*.ome.tiff"
          ontologies:
            - edam: "http://edamontology.org/format_3727"
  - ome_zarr:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.ome.zarr":
          type: directory
          description: OME-NGFF 0.5 (Zarr v3) store
          pattern: "*.ome.zarr"
  - mzml:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.mzML":
          type: file
          description: Indexed mzML 1.1
          pattern: "*.mzML"
          ontologies:
            - edam: "http://edamontology.org/format_3244"
  - csv:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.csv":
          type: file
          description: One table or one trace sweep as CSV
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752"
  - parquet:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.parquet":
          type: file
          description: A table, a trace or mass spectra as Apache Parquet with units in the metadata
          pattern: "*.parquet"
  - report:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.export.json":
          type: file
          description: Export report (`verified`, sizes, planes or rows written)
          pattern: "*.export.json"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@richardzimring"
maintainers:
  - "@richardzimring"
