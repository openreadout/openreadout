[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "napari-openreadout"
version = "0.1.0"
description = "napari reader plugin that opens microscopy files lazily with OpenReadout"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [{ name = "The OpenReadout Authors", email = "openreadout@gmail.com" }]
keywords = ["napari", "microscopy", "czi", "nd2", "lif", "svs", "whole-slide", "ome-zarr"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: napari",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
# napari itself is not a dependency: the plugin is loaded by napari, and its tests run without
# a GUI (npe2 reads the manifest; the reader returns plain layer data).
dependencies = [
  "openreadout[dask]>=0.1.0,<0.2",
  "numpy>=1.22",
]

[project.optional-dependencies]
test = ["pytest>=7", "npe2>=0.7"]

[project.entry-points."napari.manifest"]
napari-openreadout = "napari_openreadout:napari.yaml"

[project.urls]
Homepage = "https://github.com/openreadout/openreadout"
Repository = "https://github.com/openreadout/openreadout"
Documentation = "https://openreadout.github.io/openreadout/guides/napari.html"

[tool.hatch.build.targets.wheel]
packages = ["napari_openreadout"]

[tool.hatch.build.targets.sdist]
include = ["napari_openreadout", "tests", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
