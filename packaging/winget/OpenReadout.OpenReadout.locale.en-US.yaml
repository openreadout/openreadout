ShortDescription: Read raw lab-instrument files without the vendor software.
Description: |-
  One binary that reads raw files from microscopes, mass spectrometers, chromatographs, flow
  cytometers, plate readers and other lab instruments. It prints what is in them as text or JSON,
  checks them for damage, exports them to open formats such as OME-TIFF and mzML, and runs as an
  MCP server for AI agents. It works offline and never modifies the source file.
