nam = "nam"              # Bruker BES3T `xNAM` axis-name keys
gud = "gud"              # Shimadzu LabSolutions XML element `GUD`
tio = "tio"              # the WITio MATLAB toolbox
onl = "onl"              # HEKA PatchMaster `.onl` tree
fle = "fle"              # Bruker timsTOF fleX
ded = "ded"              # "ANDed"
mis = "mis"              # "mis-decodes"
comput = "comput"        # journal abbreviation (Neural Comput.)
reson = "reson"          # journal abbreviation (J. Magn. Reson.)
# Vendor spellings that readers must match exactly
