parms = "parms"            # Agilent `StingrayViewParms`
valide = "valide"          # Seahorse `ValideRate`
chrone = "chrone"          # `IsoChroneType`
choosen = "choosen"        # UNICORN `ColumnsChoosen`
criterias = "criterias"    # UNICORN `ResultSearchCriterias`
assymetry = "assymetry"    # UNICORN peak table column
compability = "compability"  # Biacore `BIA compability info` stream
acquistion = "acquistion"  # ChemStation report text `Acquistion Mode`
caputre = "caputre"        # Olympus `ImageCaputreDate`
mesurement = "mesurement"  # Rigaku `MesurementConditions`
datas = "datas"            # a key in vendor JSON
subtiles = "subtiles"
unparseable = "unparseable"  # accepted spelling
