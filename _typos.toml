acn = "acn"              # acetonitrile (LC mobile phase)
aci = "aci"              # Arbin auxiliary channel interface (`ACI_Phase_Angle`)
als = "als"              # Agilent HiP-ALS autosampler
thm = "thm"              # OpenLab device name `THM` (column thermostat)
