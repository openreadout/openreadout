# Local names and test data
thr = "thr"              # threshold
allo = "allo"
nin = "nin"              # bytes in (inflate status)
gam = "gam"              # Gamry flag in an oracle script
iy = "iy"                # overlap along y
wheight = "wheight"      # weighted height
