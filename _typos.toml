# Configuration for the `typos` spell checker (https://github.com/crate-ci/typos), run in CI.
# Instrument-file formats are full of short identifiers that look like typos to a generic
# dictionary. Add a word here only when it is format vocabulary or a proper noun, and say why.

[files]
extend-exclude = [
  "corpus/files",          # downloaded binary test data (gitignored)
  "corpus/oracle/*.json",  # generated ground truth: hashes and vendor strings
  "oracle/schema/*.xsd",   # third-party OME schema, kept verbatim
  "*.lock",
  "book/book",             # mdBook build output
  "THIRD-PARTY-NOTICES.md", # generated by cargo-about: third-party license texts, verbatim
  "evals/facts/*.json",   # facts copied verbatim from corpus files (vendor paths and names, e.g. French folder names)
]

[default]
# Hex digests (xxh3, sha256) and base64 blobs are never words.
extend-ignore-re = [
  "\\b[0-9a-f]{16,}\\b",
  "LTQ OT Discovery",      # Thermo instrument user name recorded in corpus files (mtbls404, mtbls20)
]

[default.extend-words]
# Format and standard names
nd = "nd"      # Nikon ND2 (`nd2`, `Nd2Reader`) and the NIS-Elements `.nd` sequence format
ome = "ome"    # Open Microscopy Environment (OME-TIFF, OME-XML, OME-Zarr)
pn = "pn"      # FCS parameter keywords `$PnN`, `$PnS`, `$PnR`, ... (FCS 3.1 standard)
ser = "ser"    # FEI/TIA `.ser` electron-microscopy files; Bruker NMR `ser` data files
varian = "varian"  # Varian (now Agilent) NMR spectrometer data
gti = "gti"    # `GTI$...` FCS vendor keyword namespace (Guava Technologies cytometers)
aimd = "aimd"  # ND2 legacy (NIS-Elements 2.x) metadata box name `AIMD`
siz = "siz"    # JPEG 2000 SIZ (image and tile size) marker segment, ISO/IEC 15444-1
usera = "usera"  # Bruker TopSpin acqus user fields `USERA1`…`USERA5`
ccomment = "ccomment"  # Blackrock NEV extended-header tag `CCOMMENT` (continued comment), LB-0023
hande = "hande"      # "H&E" (hematoxylin and eosin) stain in an OME QPTIFF sample file name
nversion = "nversion"  # MRC2014 header field `NVERSION` (format version), CCP-EM specification
itms = "itms"        # ion-trap mass analyzer (`ITMS`) in Thermo scan filters
infomation = "infomation"  # Olympus OIR XML element `fileinfo:fileInfomation` (the vendor's spelling)
oaut = "oaut"        # Microsoft [MS-OAUT] open specification (VARIANT type codes)
ba = "ba"            # barium, as in BaTiO3 (a DM3 corpus sample)
vas = "vas"          # "vas" (vasculature) in a Figshare corpus file name
flate = "flate"      # the `flate2` crate
clen = "clen"        # compressed length, a local name in the timsTOF reader
# Third-party API names
writeable = "writeable"  # NumPy `ndarray.flags.writeable`
arange = "arange"        # NumPy `np.arange`

[default.extend-identifiers]
OTHERn = "OTHERn"  # FCS 3.1 OTHER segments, numbered (`OTHER1`, `OTHER2`, ...)
ot = "ot"          # a loop variable (one trace) in the HDF5 fixture tests
