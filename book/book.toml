[book]
title = "OpenReadout"
description = "OpenReadout reads raw lab-instrument files without vendor software, prints JSON, exports to open formats and runs as an MCP server."
authors = ["The OpenReadout Authors"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Fail instead of silently creating an empty page when SUMMARY.md names a missing file.
create-missing = false

# Rewrites the GitHub-relative links of files included from docs/ (see repo_links.py).
[preprocessor.repo-links]
command = "python3 repo_links.py"
before = ["links"]

[output.html]
site-url = "/openreadout/"
git-repository-url = "https://github.com/openreadout/openreadout"
edit-url-template = "https://github.com/openreadout/openreadout/edit/main/book/{path}"

[output.html.search]
enable = true

[output.html.fold]
enable = true
level = 0
