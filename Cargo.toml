[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# fuzz/ (cargo-fuzz, nightly) and oracle/timsrust-oracle are separate workspaces: never built by
# `cargo build`/`cargo test` here and never published (both are `publish = false`).
exclude = ["fuzz", "oracle/timsrust-oracle"]
default-members = [
    "crates/openreadout-core",
    "crates/openreadout-codecs",
    "crates/openreadout-jpegxr",
    "crates/openreadout-czi",
    "crates/openreadout-nd2",
    "crates/openreadout-lif",
    "crates/openreadout-tiff",
    "crates/openreadout-fcs",
    "crates/openreadout-thermo",
    "crates/openreadout-agilent-ms",
    "crates/openreadout-sciex",
    "crates/openreadout-waters",
    "crates/openreadout-plate",
    "crates/openreadout-qpcr",
    "crates/openreadout-assay",
    "crates/openreadout-oir",
    "crates/openreadout-vsi",
    "crates/openreadout-wsi",
    "crates/openreadout-abf",
    "crates/openreadout-neuralynx",
    "crates/openreadout-blackrock",
    "crates/openreadout-spikeglx",
    "crates/openreadout-intan",
    "crates/openreadout-plexon",
    "crates/openreadout-ephys",
    "crates/openreadout-chrom",
    "crates/openreadout-em",
    "crates/openreadout-nmr",
    "crates/openreadout-signal",
    "crates/openreadout-ometiff",
    "crates/openreadout-omezarr",
    "crates/openreadout-zarr",
    "crates/openreadout-hdf5",
    "crates/openreadout-zvi",
    "crates/openreadout-oif",
    "crates/openreadout-dcimg",
    "crates/openreadout-hcs",
    "crates/openreadout-spectro",
    "crates/openreadout-fplc",
    "crates/openreadout-biophys",
    "crates/openreadout-gel",
    "crates/openreadout-epr",
    "crates/openreadout-xrd",
    "crates/openreadout-thermal",
    "crates/openreadout-echem",
    "crates/openreadout-preview",
    "crates/openreadout-quant",
    "crates/openreadout-ops",
    "crates/openreadout-mzml-writer",
    "crates/openreadout-arrow",
    "crates/openreadout-mzml",
    "crates/openreadout-bruker-tims",
    "crates/openreadout-index",
    "crates/openreadout-batch",
    "crates/openreadout-live",
    "crates/openreadout-mcp",
    "crates/openreadout-cli",
    "crates/openreadout-bench",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["The OpenReadout Authors <openreadout@gmail.com>"]
repository = "https://github.com/openreadout/openreadout"
homepage = "https://github.com/openreadout/openreadout"
keywords = ["microscopy", "czi", "nd2", "lif", "ome-tiff"]
categories = ["command-line-utilities", "parser-implementations", "science"]

[workspace.dependencies]
# internal
openreadout-core = { path = "crates/openreadout-core", version = "0.2.0" }
openreadout-codecs = { path = "crates/openreadout-codecs", version = "0.2.0" }
openreadout-jpegxr = { path = "crates/openreadout-jpegxr", version = "0.2.0" }
openreadout-czi = { path = "crates/openreadout-czi", version = "0.2.0" }
openreadout-nd2 = { path = "crates/openreadout-nd2", version = "0.2.0" }
openreadout-lif = { path = "crates/openreadout-lif", version = "0.2.0" }
openreadout-tiff = { path = "crates/openreadout-tiff", version = "0.2.0" }
openreadout-fcs = { path = "crates/openreadout-fcs", version = "0.2.0" }
openreadout-thermo = { path = "crates/openreadout-thermo", version = "0.2.0" }
openreadout-agilent-ms = { path = "crates/openreadout-agilent-ms", version = "0.2.0" }
openreadout-sciex = { path = "crates/openreadout-sciex", version = "0.2.0" }
openreadout-waters = { path = "crates/openreadout-waters", version = "0.2.0" }
