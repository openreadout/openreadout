name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: every commit is signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for c in $(git rev-list "$BASE".."$HEAD" --no-merges); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c lacks a Signed-off-by trailer (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
