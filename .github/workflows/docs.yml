name: Docs

# Builds the mdBook in book/ on every pull request that touches documentation, and publishes it
# to GitHub Pages on pushes to main. One-time setup: Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "README.md"
      - "skills/**"
      - "web/**"
      - "crates/openreadout-wasm/**"
      - "packaging/wasm/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "book/**"
      - "docs/**"
      - "examples/**"
      - "CHANGELOG.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: "0.5.4"

jobs:
  build:
    name: build the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}
      - name: Regenerate the JSON reference from docs/schema
        run: python3 book/gen_json_reference.py
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Regenerate the project-health page from the repository
        run: cargo xtask health --write
      - name: Build
        run: mdbook build book
      # Every relative link and #fragment of the built site must resolve (book/check_links.py).
      - name: Check links
        run: python3 book/check_links.py
      # The drop-a-file demo (web/, book/src/guides/wasm.md) goes to book/book/demo/ on the published site.
      # Pull requests skip it: the CI `wasm` job builds and tests it.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: github.event_name != 'pull_request'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.event_name != 'pull_request'
      - name: Demo page (WebAssembly build)
        if: github.event_name != 'pull_request'
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          if ! wasm-bindgen --version 2>/dev/null | grep -qx "wasm-bindgen $v"; then
            cargo install wasm-bindgen-cli --locked --version "$v"
          fi
          (cd packaging/wasm && npm ci)
          scripts/wasm.sh build
          scripts/wasm.sh demo
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: book/book

  deploy:
    # Needs GitHub Pages enabled (Settings > Pages > Source: GitHub Actions). Set repo variable DEPLOY_PAGES=true afterwards.
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
