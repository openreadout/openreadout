name: Docs

# Publishes the website in book/ to GitHub Pages on pushes to main. site.yml builds it; ci.yml
# runs the same build on pull requests. One-time setup: Settings > Pages > Source: "GitHub
# Actions", then set the repository variable DEPLOY_PAGES=true.

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "README.md"
      - "skills/**"
      - "crates/**"
      - "web/**"
      - "packaging/wasm/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    uses: ./.github/workflows/site.yml # zizmor: ignore[self-repository] (actionlint knows only ./)

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
