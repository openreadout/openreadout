# Weekly dependency updates, grouped so each ecosystem gets one pull request a week rather than one
# per package. Security updates (switched on under Settings > Code security > Dependabot security
# updates) come as soon as an advisory is published and are not grouped with these.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz  # the fuzz targets have their own lockfile
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  # Python: the openreadout package (root pyproject.toml, maturin) and the bioio plugin.
  - package-ecosystem: pip
    directories:
      - /
      - /python/bioio-openreadout
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The oracle environment (third-party readers used only to generate ground truth) and the eval
  # harness, both locked with uv.
  - package-ecosystem: uv
    directories:
      - /oracle
      - /evals
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # The website, the WebAssembly package's build tools and the npm wrapper.
  - package-ecosystem: npm
    directories:
      - /book
      - /packaging/wasm
      - /packaging/npm
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
