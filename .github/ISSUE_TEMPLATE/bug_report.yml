name: Bug report
description: Report an error or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong, and what did you expect? Include the command and its output if you can.
    validations:
      required: true

  - type: textarea
    id: file
    attributes:
      label: File
      description: The format, the software that wrote it, and a link if you can share it.
      placeholder: e.g., Zeiss CZI from ZEN 3.6 (blue edition)

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `openreadout --version`.
      placeholder: e.g., openreadout 0.4.0
