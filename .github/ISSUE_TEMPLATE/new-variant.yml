name: File not read or not validated
description: A file in a supported format is refused, fails, or comes back `unvalidated` or `partially_validated`
labels: ["new-variant", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        `openreadout report FILE` writes a local file with no data values, names or paths. Please look it over before attaching it, and leave out vendor SDKs and documents shared under an NDA ([clean-room policy](https://github.com/openreadout/openreadout/blob/main/docs/legal/clean-room-policy.md)).

  - type: textarea
    id: report
    attributes:
      label: Report
      description: Drag the `openreadout-report-*.json` file here.
    validations:
      required: true

  - type: input
    id: software
    attributes:
      label: Instrument and software
      placeholder: e.g., Orbitrap Exploris 480, Xcalibur 4.6
    validations:
      required: true

  - type: textarea
    id: export
    attributes:
      label: Vendor export
      description: If you can, the vendor software's export of the same file (OME-TIFF, mzML or CSV). It lets us check every value.

  - type: textarea
    id: public
    attributes:
      label: Public sample file
      description: A link to a similar file under CC0 or CC BY (for example on Zenodo), if you can share one.
