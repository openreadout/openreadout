name: Format request
description: Ask for a new file format, or for more from a format that's already supported
labels: ["format-request"]
body:
  - type: markdown
    attributes:
      value: |
        Please leave out vendor SDKs, DLLs and documents shared under an NDA. Our [clean-room policy](https://github.com/openreadout/openreadout/blob/main/docs/legal/clean-room-policy.md) means we can't use them.

  - type: input
    id: format
    attributes:
      label: Format
      placeholder: e.g., Olympus OIR (.oir)
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: What do you need from these files?
      placeholder: e.g., the metadata, the images, an export to OME-TIFF
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Sample files
      description: Links to files you can share under an open license, if you have any.
