[package]
name = "openreadout-fuzz"
version = "0.0.0"
publish = false
# 2021 so the harness may set OPENREADOUT_MAX_PLANE_BYTES with `std::env::set_var` in `init`.
edition = "2021"
license = "MIT OR Apache-2.0"
description = "cargo-fuzz (libFuzzer) targets for every OpenReadout parser and codec"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
openreadout-core = { path = "../crates/openreadout-core" }
openreadout-codecs = { path = "../crates/openreadout-codecs" }
openreadout-czi = { path = "../crates/openreadout-czi", features = ["fuzzing"] }
openreadout-nd2 = { path = "../crates/openreadout-nd2", features = ["fuzzing"] }
openreadout-lif = { path = "../crates/openreadout-lif", features = ["fuzzing"] }
openreadout-ometiff = { path = "../crates/openreadout-ometiff" }
openreadout-abf = { path = "../crates/openreadout-abf" }
openreadout-blackrock = { path = "../crates/openreadout-blackrock" }
openreadout-em = { path = "../crates/openreadout-em" }
openreadout-fcs = { path = "../crates/openreadout-fcs" }
openreadout-intan = { path = "../crates/openreadout-intan" }
openreadout-neuralynx = { path = "../crates/openreadout-neuralynx" }
openreadout-nmr = { path = "../crates/openreadout-nmr" }
openreadout-signal = { path = "../crates/openreadout-signal" }
openreadout-spikeglx = { path = "../crates/openreadout-spikeglx" }
openreadout-thermo = { path = "../crates/openreadout-thermo" }
openreadout-tiff = { path = "../crates/openreadout-tiff" }
openreadout-mzml = { path = "../crates/openreadout-mzml" }
openreadout-bruker-tims = { path = "../crates/openreadout-bruker-tims" }
openreadout-oir = { path = "../crates/openreadout-oir" }
openreadout-vsi = { path = "../crates/openreadout-vsi" }
openreadout-wsi = { path = "../crates/openreadout-wsi" }
openreadout-chrom = { path = "../crates/openreadout-chrom" }
openreadout-sciex = { path = "../crates/openreadout-sciex" }
openreadout-agilent-ms = { path = "../crates/openreadout-agilent-ms" }
openreadout-waters = { path = "../crates/openreadout-waters" }
openreadout-plate = { path = "../crates/openreadout-plate" }
openreadout-qpcr = { path = "../crates/openreadout-qpcr" }
openreadout-assay = { path = "../crates/openreadout-assay" }
openreadout-batch = { path = "../crates/openreadout-batch" }
openreadout-zvi = { path = "../crates/openreadout-zvi" }
openreadout-oif = { path = "../crates/openreadout-oif" }
openreadout-plexon = { path = "../crates/openreadout-plexon" }
openreadout-ephys = { path = "../crates/openreadout-ephys" }
openreadout-dcimg = { path = "../crates/openreadout-dcimg" }
openreadout-hcs = { path = "../crates/openreadout-hcs" }
openreadout-spectro = { path = "../crates/openreadout-spectro" }
openreadout-biophys = { path = "../crates/openreadout-biophys" }
openreadout-gel = { path = "../crates/openreadout-gel" }
openreadout-thermal = { path = "../crates/openreadout-thermal" }
openreadout-echem = { path = "../crates/openreadout-echem" }
openreadout-xrd = { path = "../crates/openreadout-xrd" }
openreadout-epr = { path = "../crates/openreadout-epr" }
openreadout-fplc = { path = "../crates/openreadout-fplc" }
openreadout-zarr = { path = "../crates/openreadout-zarr" }
openreadout-hdf5 = { path = "../crates/openreadout-hdf5" }
openreadout-quant = { path = "../crates/openreadout-quant" }
serde_json = { version = "1", features = ["preserve_order"] }
roxmltree = "0.20"

# Not a member of the main workspace: it needs nightly and libFuzzer instrumentation.
[workspace]
members = ["."]

[profile.release]
debug = 1

# image-webp 0.2.4 adds Huffman code counts in u16 without overflow checks (a hostile lossless
# stream overflows; found by fuzz target codec_webp, not fixed upstream as of 2026-09-24). Release
# builds wrap and then reject the code as invalid; build it the same way everywhere so debug builds
# and the fuzzer do not panic on it (reproducer: fuzz/known-upstream/image-webp-0.2.4-huffman-overflow.webp).
[profile.release.package.image-webp]
overflow-checks = false

